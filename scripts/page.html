<!doctype html>
<html lang="$lang$">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$pagetitle$</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.green.min.css">
<link rel="stylesheet" href="assets/styles/docs.css">
$if(highlighting-css)$
<style>$highlighting-css$</style>
$endif$
</head>
<body>
<header class="container page-header">
<div class="title-row">
<h1>$title$</h1>
<a href="$edit-index-url$" class="title-edit" aria-label="Titel auf GitHub bearbeiten" title="Titel auf GitHub bearbeiten">$pencil-icon$</a>
</div>
<nav aria-label="Dokumentaktionen"><ul>
<li><a href="dokumentation.pdf" role="button" class="outline" download><svg class="download-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></svg> PDF herunterladen</a></li>
</ul></nav>
</header>
<div class="container docs-layout">
<aside class="contents">
<nav aria-label="Kapitel">
<h2>Kapitel</h2>
$chapter-navigation$
</nav>
$if(toc)$
<nav aria-label="Auf dieser Seite">
<h2>Auf dieser Seite</h2>
$table-of-contents$
</nav>
$endif$
</aside>
<main id="inhalt">
<p class="chapter-edit"><a href="$edit-page-url$">$pencil-icon$ Bearbeiten auf GitHub</a></p>
$body$
</main>
</div>
<footer class="container"><small>Dokumentation aus Markdown · Bearbeiten öffnet die Quelldatei auf GitHub.</small></footer>
</body>
</html>
